<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>গ্রাম উন্নতি - Member Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- সদস্য লগইন স্ক্রিন -->
  <section id="screen-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-md border border-slate-200 p-6 space-y-5">
      <div class="bg-[#07422C] text-white rounded-xl p-4">
        <p class="text-[11px] uppercase tracking-wider text-emerald-200">Gram Unnati • Digital Khata</p>
        <h1 class="text-lg font-bold mt-0.5">মহিলা সদস্য লগইন</h1>
        <p class="text-xs text-emerald-100 mt-1">আপনার Member ID ও পাসওয়ার্ড দিয়ে সবজি জমা এবং গ্রোসারি ক্রেডিট ব্যালেন্স দেখুন।</p>
      </div>

      <form id="login-form" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Member ID (সদস্য আইডি)</label>
          <input
            type="text"
            id="login-id"
            required
            placeholder="যেমন: GUUS005"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 uppercase focus:outline-none focus:border-[#07422C]"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password (পাসওয়ার্ড)</label>
          <input
            type="password"
            id="login-pass"
            required
            placeholder="পাসওয়ার্ড দিন"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-[#07422C]"
          />
        </div>

        <p id="login-error" class="text-xs text-red-600 hidden"></p>

        <button
          type="submit"
          class="w-full py-3 rounded-xl bg-[#07422C] hover:bg-[#053322] text-white font-bold text-sm transition"
        >
          প্রবেশ করুন (Login)
        </button>
      </form>
    </div>
  </section>

  <!-- সদস্য ওয়ালেট ড্যাশবোর্ড -->
  <section id="screen-wallet" class="hidden max-w-xl mx-auto p-4 pb-12 space-y-4">
    <header class="bg-[#07422C] text-white rounded-2xl p-4 shadow flex items-center justify-between">
      <div>
        <p id="wallet-member-id" class="text-[11px] uppercase tracking-wider text-emerald-200">ID: —</p>
        <h1 id="wallet-member-name" class="text-lg font-bold">সদস্যের নাম</h1>
      </div>
      <div class="flex items-center gap-2">
        <button
          type="button"
          id="btn-refresh"
          class="px-3 py-1.5 rounded-lg bg-emerald-800 hover:bg-emerald-700 text-xs font-medium"
        >
          রিফ্রেশ
        </button>
        <button
          type="button"
          id="btn-logout"
          class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-medium"
        >
          লগআউট
        </button>
      </div>
    </header>

    <!-- ব্যালেন্স কার্ডসমূহ -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs text-slate-500">মোট সবজি জমা</p>
        <p id="stat-deposit" class="text-xl font-bold text-emerald-700 mt-1">₹0</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs text-slate-500">মোট গ্রোসারি কেনা</p>
        <p id="stat-purchase" class="text-xl font-bold text-slate-800 mt-1">₹0</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs text-slate-500">Available Credit</p>
        <p id="stat-credit" class="text-xl font-bold text-[#07422C] mt-1">₹0</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs text-slate-500">Credit Limit</p>
        <p id="stat-limit" class="text-xl font-bold text-slate-700 mt-1">₹0</p>
      </div>
    </div>

    <!-- লেনদেনের তালিকা -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
      <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">সাম্প্রতিক লেনদেন</h2>
      <div id="txn-list" class="space-y-2 text-xs">
        <p class="text-slate-400">কোনো লেনদেন পাওয়া যায়নি।</p>
      </div>
    </div>
  </section>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzru2jLpvyDa4oMcq6RVqzpDX17FTClMG2QAw6JQ8CZL0xm1zaf27MbbbRUUREC3VZJ/exec'; // আপনার Apps Script Web App URL বসান

    let membersData = [];
    let transactionsData = [];
    let currentMember = null;

    function showLoginError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    async function syncFromGoogleSheet() {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_GAS_WEB_APP_URL_HERE')) {
        return;
      }
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getAll`);
        const data = await res.json();
        membersData = Array.isArray(data.members) ? data.members : [];
        transactionsData = Array.isArray(data.transactions) ? data.transactions : [];

        if (currentMember) {
          const updated = membersData.find(
            m => String(m.Member_ID || '').trim().toUpperCase() === String(currentMember.Member_ID || '').trim().toUpperCase()
          );
          if (updated) {
            currentMember = updated;
            renderWallet();
          }
        }
      } catch (err) {
        console.error('Sync error:', err);
      }
    }

    function renderWallet() {
      if (!currentMember) return;
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-wallet').classList.remove('hidden');

      const id = String(currentMember.Member_ID || '').trim();
      document.getElementById('wallet-member-id').textContent = `ID: ${id}`;
      document.getElementById('wallet-member-name').textContent = currentMember.Name || 'সদস্য';

      document.getElementById('stat-deposit').textContent = `₹${currentMember.Total_Deposit ?? 0}`;
      document.getElementById('stat-purchase').textContent = `₹${currentMember.Total_Purchase ?? 0}`;
      document.getElementById('stat-credit').textContent = `₹${currentMember.Available_Credit ?? 0}`;
      document.getElementById('stat-limit').textContent = `₹${currentMember.Credit_Limit ?? 0}`;

      const myTxns = transactionsData
        .filter(t => String(t.Member_ID || '').trim().toUpperCase() === id.toUpperCase())
        .slice()
        .reverse();

      const listEl = document.getElementById('txn-list');
      if (myTxns.length === 0) {
        listEl.innerHTML = '<p class="text-slate-400">কোনো লেনদেন পাওয়া যায়নি।</p>';
        return;
      }

      listEl.innerHTML = myTxns.map(t => {
        const isDeposit = String(t.Type || '').trim().toUpperCase() === 'DEPOSIT';
        const badgeClass = isDeposit
          ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
          : 'bg-amber-50 text-amber-800 border-amber-200';
        const sign = isDeposit ? '+' : '-';
        const dateText = t.Date ? String(t.Date).slice(0, 10) : '';

        return `
          <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50/60">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-md border text-[10px] font-bold ${badgeClass}">
                  ${isDeposit ? 'সবজি জমা' : 'কেনাকাটা'}
                </span>
                <span class="font-semibold text-slate-800">${t.Description || ''}</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-1">${dateText}</p>
            </div>
            <div class="text-right font-bold ${isDeposit ? 'text-emerald-700' : 'text-slate-800'}">
              ${sign}₹${t.Amount ?? 0}
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('login-error').classList.add('hidden');

      const inputId = document.getElementById('login-id').value.trim().toUpperCase();
      const inputPass = document.getElementById('login-pass').value.trim();

      if (membersData.length === 0) {
        await syncFromGoogleSheet();
      }

      const member = membersData.find(
        m => String(m.Member_ID || '').trim().toUpperCase() === inputId
      );

      if (!member) {
        showLoginError('Member ID খুঁজে পাওয়া যায়নি!');
        return;
      }

      if (String(member.Password ?? '').trim() !== inputPass) {
        showLoginError('পাসওয়ার্ড সঠিক নয়!');
        return;
      }

      currentMember = member;
      sessionStorage.setItem('gmt_logged_member_id', inputId);
      renderWallet();
    });

    document.getElementById('btn-refresh').addEventListener('click', syncFromGoogleSheet);

    document.getElementById('btn-logout').addEventListener('click', () => {
      currentMember = null;
      sessionStorage.removeItem('gmt_logged_member_id');
      document.getElementById('screen-wallet').classList.add('hidden');
      document.getElementById('screen-login').classList.remove('hidden');
      document.getElementById('login-pass').value = '';
    });

    window.addEventListener('load', async () => {
      await syncFromGoogleSheet();
      const savedId = sessionStorage.getItem('gmt_logged_member_id');
      if (savedId) {
        const found = membersData.find(
          m => String(m.Member_ID || '').trim().toUpperCase() === savedId.toUpperCase()
        );
        if (found) {
          currentMember = found;
          renderWallet();
        }
      }
    });
  </script>
</body>
</html>
